<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'SF Mono', Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF41" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF41" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="280" rx="14" fill="#0D1117"/>
  <rect width="900" height="280" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#00FF41" stroke-opacity="0.35"/>

  <!-- scanning line -->
  <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="30" y="38" fill="#00FF41" font-size="14" font-weight="600">$ pipeline --run --live</text>
  <circle cx="860" cy="33" r="5" fill="#00FF41">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="840" y="38" fill="#a9a9b3" font-size="11" text-anchor="end">LIVE</text>

  <!-- connector rail -->
  <path d="M90,130 L810,130" stroke="#00FF41" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- data packets (behind nodes, so they pass "through" them) -->
  <g filter="url(#glow)" fill="#00FF41">
    <circle r="5"><animateMotion path="M90,130 L810,130" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="5"><animateMotion path="M90,130 L810,130" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5"><animateMotion path="M90,130 L810,130" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
    <circle r="5"><animateMotion path="M90,130 L810,130" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- nodes -->
  <g>
    <!-- 1 NETWORK -->
    <rect x="25" y="95" width="130" height="70" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="135" fill="#00FF41" font-size="14" font-weight="700" text-anchor="middle">NETWORK</text>
    <text x="90" y="190" fill="#a9a9b3" font-size="11" text-anchor="middle">TCP/IP · Firewall</text>

    <!-- 2 INGEST -->
    <rect x="205" y="95" width="130" height="70" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="270" y="135" fill="#00FF41" font-size="14" font-weight="700" text-anchor="middle">INGEST</text>
    <text x="270" y="190" fill="#a9a9b3" font-size="11" text-anchor="middle">APIs · Logs · Files</text>

    <!-- 3 TRANSFORM -->
    <rect x="385" y="95" width="130" height="70" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="135" fill="#00FF41" font-size="14" font-weight="700" text-anchor="middle">TRANSFORM</text>
    <text x="450" y="190" fill="#a9a9b3" font-size="11" text-anchor="middle">ETL · Python · SQL</text>

    <!-- 4 DATABASE (cylinder) -->
    <rect x="565" y="95" width="130" height="70" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#00FF41" stroke-width="1.5" fill="none">
      <ellipse cx="630" cy="112" rx="16" ry="5"/>
      <path d="M614,112 V132 A16,5 0 0 0 646,132 V112"/>
      <path d="M614,122 A16,5 0 0 0 646,122" stroke-opacity="0.6"/>
    </g>
    <text x="630" y="153" fill="#00FF41" font-size="14" font-weight="700" text-anchor="middle">DATABASE</text>
    <text x="630" y="190" fill="#a9a9b3" font-size="11" text-anchor="middle">PostgreSQL / ORACLE · Tuning</text>

    <!-- 5 INSIGHT -->
    <rect x="745" y="95" width="130" height="70" rx="10" fill="#0D1117" stroke="#00FF41" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="810" y="135" fill="#00FF41" font-size="14" font-weight="700" text-anchor="middle">INSIGHT</text>
    <text x="810" y="190" fill="#a9a9b3" font-size="11" text-anchor="middle">Reports · Decisions</text>
  </g>

  <!-- animated bars (query throughput) -->
  <g fill="#00FF41" fill-opacity="0.8">
    <rect x="30" y="252" width="10" height="0"><animate attributeName="height" values="4;18;8;14;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="266;252;262;256;266" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="46" y="252" width="10" height="0"><animate attributeName="height" values="14;6;18;8;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="256;264;252;262;256" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="62" y="252" width="10" height="0"><animate attributeName="height" values="8;16;4;18;8" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="262;254;266;252;262" dur="2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="84" y="266" fill="#a9a9b3" font-size="11">queries optimized · indexes tuned · data flowing</text>
</svg>
