g</text><rect x="560.0" y="55.0" width="130" height="80" rx="9" fill="#0D1117" stroke="#00FF41" stroke-width="2"></rect><text x="625" y="99" fill="#00FF41" font-size="13" font-weight="700" text-anchor="middle">REPLICA 1</text><text x="625" y="152.0" fill="#8b949e" font-size="10" text-anchor="middle">hot standby</text><rect x="560.0" y="205.0" width="130" height="80" rx="9" fill="#0D1117" stroke="#00FF41" stroke-width="2"></rect><text x="625" y="249" fill="#00FF41" font-size="13" font-weight="700" text-anchor="middle">REPLICA 2</text><text x="625" y="302.0" fill="#8b949e" font-size="10" text-anchor="middle">hot standby</text><rect x="230.0" y="115.0" width="150" height="110" rx="9" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.150;0.160;0.240;0.250;1" dur="8s" repeatCount="indefinite"/></rect><rect x="230.0" y="115.0" width="150" height="110" rx="9" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.630;0.640;0.720;0.730;1" dur="8s" repeatCount="indefinite"/></rect><rect x="30.0" y="140.0" width="100" height="60" rx="9" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.830;0.840;0.920;0.930;1" dur="8s" repeatCount="indefinite"/></rect><rect x="560.0" y="55.0" width="130" height="80" rx="9" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.410;0.420;0.500;0.510;1" dur="8s" repeatCount="indefinite"/></rect><rect x="560.0" y="205.0" width="130" height="80" rx="9" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.410;0.420;0.500;0.510;1" dur="8s" repeatCount="indefinite"/></rect><text x="715" y="84" fill="#8b949e" font-size="9" font-weight="400" text-anchor="start" >replay lag</text><rect x="715" y="92" width="140" height="6" rx="3" fill="#00FF41" fill-opacity="0.12"/><rect x="715" y="92" width="40" height="6" rx="3" fill="#00F